name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - ui/**
  pull_request:
    paths:
      - .github/workflows/test.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - ui/**

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked
