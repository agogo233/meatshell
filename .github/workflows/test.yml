name: Tests

# Linux unit-test gate, re-added after 11ce743 removed the previous workflow:
# `release.yml` only compiles the Windows binary, so the pure-logic suites
# (dock geometry, editor highlighting, config store, term buffer) never ran
# in CI. Keep this job narrow — check plus the bin test harness only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/test.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - ui/**
      - vendor/**
      - build.rs
      - lang/**
      - assets/**
  pull_request:
    paths:
      - .github/workflows/test.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - ui/**
      - vendor/**
      - build.rs
      - lang/**
      - assets/**

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev libudev-dev
      - name: Run unit and integration tests
        # No `--bins`: the top-level `tests/ui_*.rs` integration targets
        # (Slint UI regressions) were silently excluded before, so they were
        # neither run nor compiled. `tests/app/**` stays covered either way —
        # those suites mount into the bin crate via `#[path]`.
        run: cargo test --locked

