name: Build (Windows x86_64)

# Size-optimised Windows x86_64 build: `release-size` profile (opt-level = "s"
# + fat LTO, see Cargo.toml) to track how small the binary can get; uploads its
# result as a plain artifact (contents: read only); the artifact ships the bare
# directory under a timestamped name, so the downloaded zip is single-layer and
# unique per build.

on:
  # PRs get the size report; pushes to main keep the artifact. A bare
  # un-filtered `push` used to fire this windows-latest fat-LTO build on every
  # branch and tag push (~hours of CI minutes for a report with no threshold).
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "vendor/**"
      - "assets/**"
      - ".github/workflows/windows-size.yml"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86_64-size:
    name: windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-portable-size

      - name: Build (release-size)
        run: cargo build --profile release-size --target x86_64-pc-windows-msvc --locked

      - name: Report binary size
        shell: bash
        run: |
          set -eu
          EXE="target/x86_64-pc-windows-msvc/release-size/meatshell.exe"
          test -f "$EXE"
          printf '%s\n' "## Binary size report" "| build | bytes |" "|---|---|" \
            "| release-size (opt-level=s, lto=fat) | $(wc -c < "$EXE") |" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage portable build
        id: package
        shell: bash
        run: |
          set -eu
          STAGE="meatshell-windows-x86_64-portable-size"
          TS="$(date -u +%Y%m%d-%H%M%S)"
          rm -rf "$STAGE"
          mkdir "$STAGE"
          cp "target/x86_64-pc-windows-msvc/release-size/meatshell.exe" "$STAGE/"
          echo "artifact-name=${STAGE}-${TS}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: meatshell-windows-x86_64-portable-size
          retention-days: 7
          if-no-files-found: error
