name: Build (Windows x86_64)

# Single Windows build entry point, artifact only — never publishes a release:
# every push (any branch/tag) rebuilds the Windows x64 portable build and
# uploads it as a plain artifact (contents: read only); the artifact ships the
# bare directory under a timestamped name, so the downloaded zip is
# single-layer and unique per build.

on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86_64:
    name: windows-x86_64
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc-portable

      - name: Build (release)
        run: cargo build --release --target x86_64-pc-windows-msvc --locked

      - name: Stage portable build
        id: package
        shell: bash
        run: |
          set -eu
          # Fixed stage dir name; the timestamped zip name is the artifact name.
          STAGE="meatshell-windows-x86_64-portable"
          TS="$(date -u +%Y%m%d-%H%M%S)"
          rm -rf "$STAGE"
          mkdir "$STAGE"
          cp "target/x86_64-pc-windows-msvc/release/meatshell.exe" "$STAGE/"
          echo "artifact-name=${STAGE}-${TS}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        # Upload the bare directory: GitHub wraps artifacts in one zip, so the
        # download is a single-layer timestamped
        # `meatshell-windows-x86_64-portable-YYYYMMDD-HHMMSS.zip`.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: meatshell-windows-x86_64-portable
          retention-days: 7
          if-no-files-found: error

